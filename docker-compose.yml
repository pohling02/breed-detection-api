services:
  api:
    build: .
    container_name: pet-breed-api
    restart: unless-stopped
    ports:
      - "80:8089"
    environment:
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: pet-breed-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: